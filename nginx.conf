server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API (FastAPI container). Trailing slash strips the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # PWA files must always be checked again, so app updates reach the phone.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files have a hash in their name: safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
