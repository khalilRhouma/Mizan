services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: finance-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Daily database backup (pg_dump) into ./backups on the host.
  # Image: https://github.com/prodrigestivill/docker-postgres-backup-local
  # Tag must match the Postgres major version of the "db" service (16).
  # Run a backup now:  docker exec finance-backup /backup.sh
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: finance-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      # -Z1: gzip the dump (the image default, we must keep it when overriding)
      # --clean --if-exists: the dump can be restored over an existing DB
      POSTGRES_EXTRA_OPTS: "-Z1 --clean --if-exists"
      SCHEDULE: "@daily"          # cron syntax also works, e.g. "0 21 * * *"
      BACKUP_KEEP_DAYS: 7         # keep the last 7 daily dumps
      BACKUP_KEEP_WEEKS: 4        # keep 4 weekly dumps
      BACKUP_KEEP_MONTHS: 6       # keep 6 monthly dumps
      TZ: Africa/Tunis
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: finance-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
